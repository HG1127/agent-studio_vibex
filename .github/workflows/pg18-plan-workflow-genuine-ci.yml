name: Agent Studio F05 Plan Workflow genuine PG18 isolated verification

on:
  push:
    branches:
      - 'codex/pg18-worker-heartbeat-*'
      - 'codex/pg18-plan-workflow-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg18-plan-workflow-genuine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg18-plan-workflow-genuine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: agentstudio_pg18_ci
          POSTGRES_USER: agentstudio_admin
          POSTGRES_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U agentstudio_admin -d agentstudio_pg18_ci"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      AGENT_STUDIO_F05_GENUINE_CI: YES_DISPOSABLE_F05_ONLY
      AGENT_STUDIO_PG18_CI_EPHEMERAL: 'true'
      AGENT_STUDIO_PG18_CI_WRITE_APPROVED: YES_DISPOSABLE_GITHUB_ONLY
      AGENT_STUDIO_PG18_CI_HOST: '127.0.0.1'
      AGENT_STUDIO_PG18_CI_PORT: '5432'
      AGENT_STUDIO_PG18_CI_DATABASE: agentstudio_pg18_ci
      AGENT_STUDIO_PG18_CI_ADMIN_USER: agentstudio_admin
      AGENT_STUDIO_PG18_CI_ADMIN_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked API dependencies without lifecycle scripts
        run: pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Actual API compiler and pure refusal guards
        run: |
          pnpm --dir services/pg-api check
          node --experimental-strip-types --test --test-concurrency=1 services/pg-api/tests/agent-plan-workflow-audit-pure.test.mjs services/pg-api/tests/agent-plan-workflow-genuine-guard.test.mjs
      - name: Real installed064 source proofs, one-use dispatch and atomic private Workflow save
        working-directory: services/pg-api
        run: node --experimental-strip-types --test --test-concurrency=1 tests/agent-plan-workflow-genuine-pg18.test.mjs

  pg18-plan-workflow-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: agentstudio_pg18_ci
          POSTGRES_USER: agentstudio_admin
          POSTGRES_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U agentstudio_admin -d agentstudio_pg18_ci"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      AGENT_STUDIO_F05_GENUINE_CI: YES_DISPOSABLE_F05_ONLY
      AGENT_STUDIO_F05_GENUINE_SUITE: runtime
      AGENT_STUDIO_PG18_AGENT_PLAN_WORKFLOW_AVAILABLE: 'true'
      AGENT_STUDIO_PG18_AGENT_PLAN_WORKFLOW_SUBMISSIONS_ENABLED: 'true'
      AGENT_STUDIO_PG18_AGENT_PLAN_WORKFLOW_SAVES_ENABLED: 'true'
      AGENT_STUDIO_PG18_AGENT_PLAN_WORKFLOW_APPROVED: APPROVE_DISPOSABLE_PG18_NATIVE_AGENT_PLAN_WORKFLOW_ONLY
      AGENT_STUDIO_PG18_AGENT_PLAN_WORKFLOW_EXECUTION_ENABLED: 'true'
      AGENT_STUDIO_PG18_AGENT_PLAN_WORKFLOW_EXECUTION_APPROVED: APPROVE_DISPOSABLE_PG18_AGENT_PLAN_WORKFLOW_EXECUTION_ONLY
      AGENT_STUDIO_PG18_CI_EPHEMERAL: 'true'
      AGENT_STUDIO_PG18_CI_WRITE_APPROVED: YES_DISPOSABLE_GITHUB_ONLY
      AGENT_STUDIO_PG18_CI_HOST: '127.0.0.1'
      AGENT_STUDIO_PG18_CI_PORT: '5432'
      AGENT_STUDIO_PG18_CI_DATABASE: agentstudio_pg18_ci
      AGENT_STUDIO_PG18_CI_ADMIN_USER: agentstudio_admin
      AGENT_STUDIO_PG18_CI_ADMIN_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked API dependencies without lifecycle scripts
        run: pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Actual API compiler and pure refusal guards
        run: |
          pnpm --dir services/pg-api check
          node --experimental-strip-types --test --test-concurrency=1 services/pg-api/tests/agent-plan-workflow-composition.test.mjs services/pg-api/tests/agent-plan-workflow-genuine-guard.test.mjs
      - name: Real product Native composition and Worker Broker mTLS with synthetic model TLS
        working-directory: services/pg-api
        run: node --experimental-strip-types --test --test-concurrency=1 tests/agent-plan-workflow-runtime-genuine.test.mjs

  pg18-plan-workflow-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: agentstudio_pg18_ci
          POSTGRES_USER: agentstudio_admin
          POSTGRES_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U agentstudio_admin -d agentstudio_pg18_ci"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      AGENT_STUDIO_F05_GENUINE_CI: YES_DISPOSABLE_F05_ONLY
      AGENT_STUDIO_F05_GENUINE_SUITE: browser
      AGENT_STUDIO_PG18_AGENT_PLAN_WORKFLOW_AVAILABLE: 'true'
      AGENT_STUDIO_PG18_AGENT_PLAN_WORKFLOW_SUBMISSIONS_ENABLED: 'true'
      AGENT_STUDIO_PG18_AGENT_PLAN_WORKFLOW_SAVES_ENABLED: 'true'
      AGENT_STUDIO_PG18_AGENT_PLAN_WORKFLOW_APPROVED: APPROVE_DISPOSABLE_PG18_NATIVE_AGENT_PLAN_WORKFLOW_ONLY
      AGENT_STUDIO_PG18_AGENT_PLAN_WORKFLOW_EXECUTION_ENABLED: 'true'
      AGENT_STUDIO_PG18_AGENT_PLAN_WORKFLOW_EXECUTION_APPROVED: APPROVE_DISPOSABLE_PG18_AGENT_PLAN_WORKFLOW_EXECUTION_ONLY
      AGENT_STUDIO_PG18_CI_EPHEMERAL: 'true'
      AGENT_STUDIO_PG18_CI_WRITE_APPROVED: YES_DISPOSABLE_GITHUB_ONLY
      AGENT_STUDIO_PG18_CI_HOST: '127.0.0.1'
      AGENT_STUDIO_PG18_CI_PORT: '5432'
      AGENT_STUDIO_PG18_CI_DATABASE: agentstudio_pg18_ci
      AGENT_STUDIO_PG18_CI_ADMIN_USER: agentstudio_admin
      AGENT_STUDIO_PG18_CI_ADMIN_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies without lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Actual API and browser compilers plus pure startup refusals
        run: |
          pnpm --dir services/pg-api check
          pnpm exec tsc -p tsconfig.app.json --noEmit
          node --experimental-strip-types --test --test-concurrency=1 services/pg-api/tests/agent-plan-workflow-composition.test.mjs services/pg-api/tests/agent-plan-workflow-genuine-guard.test.mjs
      - name: Install isolated Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Actual employee page canvas model generation and independent save
        run: node node_modules/@playwright/test/cli.js test --config=tests/pg-native-agent-plan-workflow-genuine.config.mjs
      - name: Retain synthetic page images only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg18-plan-workflow-genuine-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/F05-genuine-browser-results/**/*.png
          if-no-files-found: ignore
