  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL API dependencies for root security tests
        run: pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Install PocketBase 0.40.5 for integration tests
        run: |
          mkdir -p .ci-bin
          curl -fsSL --retry 3 \
            https://github.com/pocketbase/pocketbase/releases/download/v0.40.5/pocketbase_0.40.5_linux_amd64.zip \
            -o .ci-bin/pocketbase.zip
          unzip -q .ci-bin/pocketbase.zip pocketbase -d .ci-bin
          chmod +x .ci-bin/pocketbase
          echo "POCKETBASE_BIN=$GITHUB_WORKSPACE/.ci-bin/pocketbase" >> "$GITHUB_ENV"
      - name: Unit regression and TypeScript production build
        run: pnpm check
      - name: Internal production readiness policy (offline unit checks only)
        run: pnpm test:readiness
      - name: PostgreSQL staging schema and isolation contract (no DB started)
        run: pnpm test:postgres-staging
      - name: Ensure local launch scripts never auto-open browser or PocketBase admin
        run: pnpm test:no-browser
      - name: PocketBase security integration
        run: pnpm test:integration
      - name: Worker without browser end-to-end
        run: pnpm test:worker
      - name: Model provider protocol transport through Agent and Workflow
        run: pnpm test:model-provider
      - name: Shared calculator execution in Agent and Workflow
        run: pnpm test:tool-executor
      - name: Cross-tenant tool debug and explicit external write consent
        run: pnpm test:tool-debug
      - name: Internal employee overview and operations data isolation
        run: pnpm test:internal-overview
      - name: Reviewed one-time internal Agent sharing and recipient isolation
        run: pnpm test:internal-templates
      - name: Prove unproxied PocketBase must not be exposed to employees
        run: pnpm test:gateway-boundary
      - name: Concurrent leases and crash replay protections
        run: pnpm test:concurrency
      - name: Agent POST side-effect journal
        run: pnpm test:agent-effects
      - name: Scheduled Agent and Workflow end-to-end
        run: pnpm test:schedules
      - name: Knowledge retrieval, citation and tenant isolation
        run: pnpm test:knowledge
      - name: V6 to V7 database upgrade and idempotency
        run: pnpm test:migrations

