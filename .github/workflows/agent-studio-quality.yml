name: Agent Studio quality

on:
  push:
    # Every main SHA needs a full push CI, including docs/config-only commits.
  pull_request:
  workflow_dispatch:

jobs:
  windows-application-policy:
    name: Windows application grants and cold launch (synthetic)
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NODE_OPTIONS: '--max-old-space-size=1024'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Windows path, application identity, approvals and launch regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp/ci-windows | Out-Null
          $env:TEMP = (Resolve-Path .tmp/ci-windows).Path
          $env:TMP = $env:TEMP
          $env:TMPDIR = $env:TEMP
          node --test --test-concurrency=2 tests/application-cold-start.test.mjs tests/local-applications.test.mjs
      - name: Local confirmation visibility and deadline (synthetic private IPC)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tmp/ci-confirmation | Out-Null
          $env:TEMP = (Resolve-Path .tmp/ci-confirmation).Path
          $env:TMP = $env:TEMP
          $env:TMPDIR = $env:TEMP
          node tests/desktop-confirmation.chrome.mjs
  pg17-tcp-isolated:
    name: Real PostgreSQL 17 / RLS / multi-worker (ephemeral)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: agentstudio_stage
          POSTGRES_USER: agentstudio_admin
          POSTGRES_PASSWORD: "synthetic-agentstudio-pg17-ci-${{ github.run_id }}"
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U agentstudio_admin -d agentstudio_stage"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated PG API dependencies
        run: pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Real PostgreSQL 17 TCP, parallel Worker, JWT, RLS and crash recovery
        env:
          AGENT_STUDIO_PG17_TEST_ENABLED: "true"
          AGENT_STUDIO_PG17_HOST: "127.0.0.1"
          AGENT_STUDIO_PG17_DATABASE: "agentstudio_stage"
          AGENT_STUDIO_PG17_ADMIN_USER: "agentstudio_admin"
          AGENT_STUDIO_PG17_ADMIN_PASSWORD: "synthetic-agentstudio-pg17-ci-${{ github.run_id }}"
        run: pnpm --dir services/pg-api run test:pg17

  pg-api-core:
    name: PostgreSQL core SQL/JWT/RLS (parallel to PocketBase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated PostgreSQL API dependencies
        run: pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Typecheck and mock HTTP contract
        run: pnpm --dir services/pg-api run check
      - name: PostgreSQL core SQL/JWT/RLS regression with bounded test concurrency
        run: |
          node --experimental-strip-types --test --test-concurrency=2 services/pg-api/tests/auth.test.mjs \
          services/pg-api/tests/postgres-engine.test.mjs services/pg-api/tests/workflow-engine.test.mjs \
          services/pg-api/tests/agent-prepare-engine.test.mjs \
          services/pg-api/tests/model-execution-engine.test.mjs services/pg-api/tests/model-upgrade.test.mjs \
          services/pg-api/tests/worker-login.test.mjs services/pg-api/tests/worker-upgrade.test.mjs \
          services/pg-api/tests/knowledge-engine.test.mjs services/pg-api/tests/document-parser.test.mjs \
          services/pg-api/tests/document-worker.test.mjs services/pg-api/tests/stage-upgrade.test.mjs \
          services/pg-api/tests/stage-login-smoke.test.mjs services/pg-api/tests/stage-login.test.mjs

  pg-migration-domains:
    name: Stage migration / ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        script:
          - test:stage-agent-import
          - test:stage-workflow-import
          - test:stage-kb-import
          - test:stage-schedule-import
          - test:stage-parallel-migrations
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated PostgreSQL API dependencies
        run: pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Independent domain migration SQL and rollback regression
        run: pnpm --dir services/pg-api run ${{ matrix.script }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated PostgreSQL CI-only dependencies
        run: pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Install PocketBase 0.40.5 for integration and unit tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ci-bin
          if ! curl -fsSL --retry 3 \
            https://github.com/pocketbase/pocketbase/releases/download/v0.40.5/pocketbase_0.40.5_linux_amd64.zip \
            -o .ci-bin/pocketbase.zip || ! curl -fsSL --retry 3 \
            https://github.com/pocketbase/pocketbase/releases/download/v0.40.5/checksums.txt \
            -o .ci-bin/checksums.txt; then
            # The public download endpoint can return repeated cached 504s.
            # Use the same official release's API assets; keep checksum checks.
            gh release download v0.40.5 --repo pocketbase/pocketbase \
              --pattern pocketbase_0.40.5_linux_amd64.zip --pattern checksums.txt \
              --dir .ci-bin --clobber
            mv .ci-bin/pocketbase_0.40.5_linux_amd64.zip .ci-bin/pocketbase.zip
          fi
          (cd .ci-bin && grep -F 'pocketbase_0.40.5_linux_amd64.zip' checksums.txt | sed 's/  pocketbase_0.40.5_linux_amd64.zip/  pocketbase.zip/' | sha256sum --check)
          unzip -q .ci-bin/pocketbase.zip pocketbase -d .ci-bin
          chmod +x .ci-bin/pocketbase
          echo "POCKETBASE_BIN=$GITHUB_WORKSPACE/.ci-bin/pocketbase" >> "$GITHUB_ENV"
      - name: LAN outbound CI gate, bundle and deployment safety tests (offline)
        run: |
          python3 -m unittest discover -s tests -p test_lan_outbound_ci.py -v
          node --test tests/lan-outbound-cicd.test.mjs
      - name: Ubuntu builder privilege-drop smoke (ephemeral)
        run: |
          # No production privileges or credentials; only synthetic nobody.
          test "$(sudo -n /usr/bin/setpriv --reuid=nobody --regid=nogroup --init-groups --no-new-privs /usr/bin/env -i PATH=/usr/bin:/bin HOME=/tmp /usr/bin/id -u)" = "$(id -u nobody)"
          sudo -n /usr/bin/setpriv --reuid=nobody --regid=nogroup --init-groups --no-new-privs /usr/bin/env -i PATH=/usr/bin:/bin HOME=/tmp /usr/bin/bash -c 'test ! -r /etc/shadow'
          echo "LINUX_BUILDER_PRIVDROP_OK"
      - name: Cache Chinese PDF test font
        uses: actions/cache@v4
        with:
          path: .ci-fonts
          key: noto-cjk-regular-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Install Chinese PDF test font
        timeout-minutes: 6
        run: |
          set -euo pipefail
          font=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          cached=.ci-fonts/NotoSansCJK-Regular.ttc
          if test -s "$cached"; then
            sudo install -D -m 0644 "$cached" "$font"
          elif ! test -s "$font"; then
            # The Azure HTTP mirror repeatedly stalled on the 61 MB package.
            # Keep apt's signed metadata/package verification, use Ubuntu's
            # official HTTPS archive, and fail within this step's budget.
            if test -f /etc/apt/apt-mirrors.txt; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            timeout 120s sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1 update -qq
            timeout 180s sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1 install -y --no-install-recommends fonts-noto-cjk
          fi
          test -s "$font"
          test "$(head -c 4 "$font")" = ttcf
          mkdir -p .ci-fonts
          if ! test -s "$cached"; then cp "$font" "$cached"; fi
      - name: Unit regression and TypeScript production build
        run: pnpm check
      - name: Internal production readiness policy (offline unit checks only)
        run: pnpm test:readiness
      - name: PostgreSQL staging schema and isolation contract (no DB started)
        run: pnpm test:postgres-staging
      - name: Ensure local launch scripts never auto-open browser or PocketBase admin
        run: pnpm test:no-browser
      - name: PocketBase security integration
        run: pnpm test:integration
      - name: Worker without browser end-to-end
        run: pnpm test:worker
      - name: Model provider protocol transport through Agent and Workflow
        run: pnpm test:model-provider
      - name: Shared calculator execution in Agent and Workflow
        run: pnpm test:tool-executor
      - name: Cross-tenant tool debug and explicit external write consent
        run: pnpm test:tool-debug
      - name: Internal employee overview and operations data isolation
        run: pnpm test:internal-overview
      - name: Reviewed one-time internal Agent sharing and recipient isolation
        run: pnpm test:internal-templates
      - name: Prove unproxied PocketBase must not be exposed to employees
        run: pnpm test:gateway-boundary
      - name: Concurrent leases and crash replay protections
        run: pnpm test:concurrency
      - name: Agent POST side-effect journal
        run: pnpm test:agent-effects
      - name: Scheduled Agent and Workflow end-to-end
        run: pnpm test:schedules
      - name: Knowledge retrieval, citation and tenant isolation
        run: pnpm test:knowledge
      - name: V6 to V7 database upgrade and idempotency
        run: pnpm test:migrations
