name: Agent Studio quality

on:
  push:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'vibex-local/start-*'
      - 'pocketbase/pb_hooks/**'
      - 'worker/**'
      - 'ops/**'
      - 'docs/**'
      - 'db/postgres/**'
      - 'services/pg-api/**'
      - 'deploy/postgres-staging/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-studio-quality.yml'
  pull_request:
  workflow_dispatch:

jobs:
  pg17-tcp-isolated:
    name: Real PostgreSQL 17 / RLS / multi-worker (ephemeral)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: agentstudio_stage
          POSTGRES_USER: agentstudio_admin
          POSTGRES_PASSWORD: "synthetic-agentstudio-pg17-ci-${{ github.run_id }}"
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U agentstudio_admin -d agentstudio_stage"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated PG API dependencies
        run: pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Real PostgreSQL 17 TCP, parallel Worker, JWT, RLS and crash recovery
        env:
          AGENT_STUDIO_PG17_TEST_ENABLED: "true"
          AGENT_STUDIO_PG17_HOST: "127.0.0.1"
          AGENT_STUDIO_PG17_DATABASE: "agentstudio_stage"
          AGENT_STUDIO_PG17_ADMIN_USER: "agentstudio_admin"
          AGENT_STUDIO_PG17_ADMIN_PASSWORD: "synthetic-agentstudio-pg17-ci-${{ github.run_id }}"
        run: pnpm --dir services/pg-api run test:pg17

  pg17-reconciliation-isolated:
    name: Real PostgreSQL 17 / source-target reconciliation (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: agentstudio_stage
          POSTGRES_USER: agentstudio_admin
          POSTGRES_PASSWORD: "synthetic-agentstudio-pg17-ci-${{ github.run_id }}-${{ github.sha }}0123456789abcdef01234567"
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U agentstudio_admin -d agentstudio_stage"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated PostgreSQL API dependencies
        run: pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Reconcile frozen synthetic SQLite to fresh PostgreSQL 17 under read-only SQL transaction
        env:
          AGENT_STUDIO_PG17_TEST_ENABLED: "true"
          AGENT_STUDIO_PG17_RECONCILIATION_TEST_ENABLED: "true"
          AGENT_STUDIO_PG17_EPHEMERAL_ISOLATED: "true"
          AGENT_STUDIO_PG17_PORT: "5432"
          AGENT_STUDIO_PG17_HOST: "127.0.0.1"
          AGENT_STUDIO_PG17_DATABASE: "agentstudio_stage"
          AGENT_STUDIO_PG17_ADMIN_USER: "agentstudio_admin"
          AGENT_STUDIO_PG17_ADMIN_PASSWORD: "synthetic-agentstudio-pg17-ci-${{ github.run_id }}-${{ github.sha }}0123456789abcdef01234567"
        run: node --experimental-strip-types --test services/pg-api/tests/pg17-reconciliation.integration.mjs

  pg-api-core:
    name: PostgreSQL core SQL/JWT/RLS (parallel to PocketBase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated PostgreSQL API dependencies
        run: pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Typecheck and mock HTTP contract
        run: pnpm --dir services/pg-api run check
      - name: PostgreSQL core SQL/JWT/RLS regression with bounded test concurrency
        run: |
          node --experimental-strip-types --test --test-concurrency=2 services/pg-api/tests/auth.test.mjs \
          services/pg-api/tests/postgres-engine.test.mjs services/pg-api/tests/workflow-engine.test.mjs \
          services/pg-api/tests/agent-prepare-engine.test.mjs \
          services/pg-api/tests/model-execution-engine.test.mjs services/pg-api/tests/model-upgrade.test.mjs \
          services/pg-api/tests/worker-login.test.mjs services/pg-api/tests/worker-upgrade.test.mjs \
          services/pg-api/tests/knowledge-engine.test.mjs services/pg-api/tests/document-parser.test.mjs \
          services/pg-api/tests/document-worker.test.mjs services/pg-api/tests/stage-upgrade.test.mjs \
          services/pg-api/tests/stage-login-smoke.test.mjs services/pg-api/tests/stage-login.test.mjs

  pg-migration-domains:
    name: Stage migration / ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        script:
          - test:stage-agent-import
          - test:stage-workflow-import
          - test:stage-kb-import
          - test:stage-schedule-import
          - test:stage-collaboration-import
          - test:stage-kb-content-import
          - test:stage-kb-atomic-cli
          - test:stage-agent-events
          - test:stage-workflow-history
          - test:stage-history-import
          - test:stage-user-import
          - test:stage-migration-identity
          - test:stage-reconciliation
          - test:stage-domain-import
          - test:stage-kb-embedding-archive
          - test:stage-kb-embedding-cli
          - test:stage-kb-combined
          - test:stage-kb-combined-cli
          - test:stage-execution-fence
          - test:stage-schedule-occurrences
          - test:stage-fence-cli
          - test:stage-occurrence-cli
          - test:stage-parallel-migrations
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated PostgreSQL API dependencies
        run: pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Independent domain migration SQL and rollback regression
        run: pnpm --dir services/pg-api run ${{ matrix.script }}

