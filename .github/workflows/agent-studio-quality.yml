    name: Stage-only migration operator / isolated image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build operator image from PG service files only
        run: docker build --file services/pg-api/Dockerfile.operator --tag agentstudio-stage-operator-ci:${{ github.sha }} services/pg-api
      - name: Default stage operator must refuse unapproved invocation without network
        shell: bash
        run: |
          set +e
          output=$(docker run --rm --network none --read-only --cap-drop ALL             --entrypoint node agentstudio-stage-operator-ci:${{ github.sha }}             services/pg-api/src/stage-migration-operator.mjs --plan 2>&1)
          result=$?
          set -e
          test "$result" -ne 0
          grep -q 'Isolated stage operator refused: invalid_arguments' <<< "$output"
          ! grep -Eq 'ECONNREFUSED|ENOTFOUND|permission denied for schema' <<< "$output"

