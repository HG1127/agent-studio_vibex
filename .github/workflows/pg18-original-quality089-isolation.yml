name: Agent Studio original quality089 isolated verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality089-isolation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality089-isolation:
    name: PG18 quality089 / ${{ matrix.suite }}
    if: github.repository == 'HG1127/agent-studio_vibex' && startsWith(github.ref, 'refs/heads/codex/pg18-')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [schema-http, worker-browser]
    env:
      AGENT_STUDIO_QUALITY089_EXPECTED_HEAD: '${{ github.sha }}'
      AGENT_STUDIO_QUALITY089_PURPOSE: YES_NEW_OWNED_DISPOSABLE_ORIGINAL_QUALITY089_ONLY
      AGENT_STUDIO_QUALITY089_SUITE: '${{ matrix.suite }}'
      AGENT_STUDIO_QUALITY089_TARGET: 127.0.0.1:5333/agent_studio/postgres
      AGENT_STUDIO_QUALITY089_WRITE_APPROVED: YES_SYNTHETIC_SAME_RUN_ONLY
      AGENT_STUDIO_PG18_CONFIG_WRITE_UAT_ENABLED: 'true'
      AGENT_STUDIO_PG18_EMPLOYEE_UAT_ENABLED: 'true'
      AGENT_STUDIO_PG18_UAT_APPROVAL: APPROVE_ISOLATED_PG18_CONFIG_UAT_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Locked source dependencies without lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Actual API compiler and ordinary-host guard tests
        run: |
          pnpm --dir services/pg-api check
          node --experimental-strip-types --test tests/quality089-hosted-guard.test.mjs tests/quality089-profile-contract.test.mjs tests/original-quality089-compile-adaptation.test.mjs
      - name: Build existing employee index and install Chromium for the separate Worker story
        if: matrix.suite == 'worker-browser'
        run: |
          node node_modules/vite/bin/vite.js build --config vibex-local/vite.original-pg.config.ts --configLoader runner
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Real PG18 catalog LOGIN Cookie CAS and team refusal
        if: matrix.suite == 'schema-http'
        run: node --experimental-strip-types ops/pg18-quality089-hosted-entry.mjs
      - name: Real Worker loopback dispatch and original employee pages
        if: matrix.suite == 'worker-browser'
        env:
          AGENT_STUDIO_PG18_RUN_APPROVAL_UAT_ENABLED: 'true'
          AGENT_STUDIO_PG18_RUN_APPROVAL_UAT_APPROVED: APPROVE_DISPOSABLE_PG18_RUN_APPROVAL_UAT_ONLY
          AGENT_STUDIO_PG18_MODEL_PROBE_UAT_ENABLED: 'true'
          AGENT_STUDIO_PG18_MODEL_PROBE_UAT_APPROVED: APPROVE_DISPOSABLE_PG18_PROVIDER_READONLY_PROBE_ONLY
          AGENT_STUDIO_PG18_WORKFLOW_V2_UAT_ENABLED: 'true'
          AGENT_STUDIO_PG18_WORKFLOW_V2_UAT_APPROVED: APPROVE_DISPOSABLE_PG18_WORKFLOW_V2_EXECUTION_ONLY
          AGENT_STUDIO_PG18_BOUND_GENERATION_UAT_ENABLED: 'true'
          AGENT_STUDIO_PG18_BOUND_GENERATION_UAT_APPROVED: APPROVE_DISPOSABLE_PG18_OWNER_BOUND_GENERATION_UAT_ONLY
          AGENT_STUDIO_PG_AUTONOMOUS_AGENT_ENABLED: 'true'
          AGENT_STUDIO_PG_AUTONOMOUS_AGENT_APPROVED: APPROVE_DISPOSABLE_PG18_AUTONOMOUS_AGENT_ONLY
          AGENT_STUDIO_PG_WORKFLOW_V2_MODEL_ENABLED: 'true'
          AGENT_STUDIO_PG_WORKFLOW_V2_MODEL_APPROVED: APPROVE_DISPOSABLE_PG18_WORKFLOW_V2_MODEL_ONLY
          AGENT_STUDIO_PG_WORKFLOW_V2_TOOLS_ENABLED: 'true'
          AGENT_STUDIO_PG_WORKFLOW_V2_TOOLS_APPROVED: APPROVE_DISPOSABLE_PG18_WORKFLOW_V2_TOOLS_ONLY
        run: node --experimental-strip-types ops/pg18-quality089-hosted-entry.mjs
