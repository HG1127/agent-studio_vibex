name: Publish desktop update to company server
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-stable-release
  cancel-in-progress: false
jobs:
  release:
    # This runner must be on the company LAN, with write access only to the
    # dedicated static update directory, not the business application or DB.
    runs-on: [self-hosted, Windows, agent-studio-release]
    timeout-minutes: 60
    env:
      TEMP: '${{ github.workspace }}\.tmp\ci-temp'
      TMP: '${{ github.workspace }}\.tmp\ci-temp'
      NODE_OPTIONS: '--max-old-space-size=1024'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release and static hosting configuration
        shell: pwsh
        env:
          UPDATE_BASE_URL: ${{ vars.DESKTOP_UPDATE_BASE_URL }}
          UPDATE_PUBLISH_DIR: ${{ vars.DESKTOP_UPDATE_PUBLISH_DIR }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          if (!$env:UPDATE_BASE_URL -or !$env:UPDATE_PUBLISH_DIR) { throw 'Configure DESKTOP_UPDATE_BASE_URL and DESKTOP_UPDATE_PUBLISH_DIR first' }
          $release = (Get-Content desktop/build-info.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "desktop-v$release") { throw 'Tag does not match desktop version' }
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify unified desktop release baseline
        run: node ops/verify-desktop-release-baseline.mjs
      - name: Install locked dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --dir desktop install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node desktop/node_modules/electron/install.js
      - name: Fetch verified isolated PocketBase test runtime
        shell: pwsh
        run: |
          $release = 'https://github.com/pocketbase/pocketbase/releases/download/v0.40.5'
          $archive = Join-Path $env:TEMP 'pocketbase_0.40.5_windows_amd64.zip'
          Invoke-WebRequest "$release/pocketbase_0.40.5_windows_amd64.zip" -OutFile $archive
          $checksums = (Invoke-WebRequest "$release/checksums.txt").Content
          $line = ($checksums -split "`n" | Where-Object { $_ -match '  pocketbase_0.40.5_windows_amd64.zip\s*$' })
          if (!$line -or ($line -split '\s+')[0] -ne (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()) { throw 'PocketBase checksum mismatch' }
          Expand-Archive $archive -DestinationPath vibex-local/bin/windows -Force
      - name: Unit tests, TypeScript and production build
        run: pnpm check
      - name: Desktop and update regression
        run: node --test desktop/tests/*.test.cjs
      - name: Full isolated employee and Worker acceptance
        run: pnpm test:e2e:parallel --workers=1
      - name: Build installer and verify packaged sources
        shell: pwsh
        run: |
          node desktop/build.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node desktop/audit.mjs
      - name: Publish immutable installer, then signed latest manifest
        shell: pwsh
        env:
          DESKTOP_UPDATE_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATE_PRIVATE_KEY }}
          UPDATE_BASE_URL: ${{ vars.DESKTOP_UPDATE_BASE_URL }}
          UPDATE_PUBLISH_DIR: ${{ vars.DESKTOP_UPDATE_PUBLISH_DIR }}
        run: |
          $release = (Get-Content desktop/build-info.json | ConvertFrom-Json).version
          node ops/publish-desktop-update.mjs "--installer=.tmp/desktop-output/AgentStudio-Setup-$release-win-x64.exe" "--base-url=$env:UPDATE_BASE_URL" "--output=$env:UPDATE_PUBLISH_DIR" --notes-file=desktop/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installer
          path: .tmp/desktop-output/AgentStudio-Setup-*.exe
