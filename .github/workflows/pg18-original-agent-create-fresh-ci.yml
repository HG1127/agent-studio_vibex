name: Agent Studio original agent-create fresh PG18 browser verification
on:
  workflow_dispatch:
    inputs:
      run_original_create:
        description: Run the original agent-create page against a disposable PG service and original Worker
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: original-agent-create-fresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-agent-create-fresh-browser:
    if: inputs.run_original_create == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: agentstudio_pg18_ci
          POSTGRES_USER: agentstudio_admin
          POSTGRES_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U agentstudio_admin -d agentstudio_pg18_ci"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      AGENT_STUDIO_ORIGINAL_AGENT_CREATE_CI: YES_DISPOSABLE_ORIGINAL_AGENT_CREATE_FRESH_ONLY
      AGENT_STUDIO_ORIGINAL_AGENT_CREATE_STORY: original-agent-create-fresh
      AGENT_STUDIO_ORIGINAL_AGENT_CREATE_EXPECTED_HEAD: '${{ github.sha }}'
      AGENT_STUDIO_ORIGINAL_AGENT_CREATE_SOURCES_SHA256: '4dee590e53965d6ad8977a0346dd62ecafe7090b662dcb4814b5611602840171'
      AGENT_STUDIO_PG18_CI_EPHEMERAL: 'true'
      AGENT_STUDIO_PG18_CI_WRITE_APPROVED: YES_DISPOSABLE_GITHUB_ONLY
      AGENT_STUDIO_PG18_CI_HOST: '127.0.0.1'
      AGENT_STUDIO_PG18_CI_PORT: '5432'
      AGENT_STUDIO_PG18_CI_DATABASE: agentstudio_pg18_ci
      AGENT_STUDIO_PG18_CI_ADMIN_USER: agentstudio_admin
      AGENT_STUDIO_PG18_CI_ADMIN_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify separately reviewed source binding before driver or service imports
        run: node --input-type=module -e "import('./tests/helpers/pg-original-agent-create-reviewed-check.mjs').then(m=>m.verifyOriginalAgentCreateSources())"
      - name: Locked root dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Locked API dependencies without lifecycle scripts
        run: pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Original page privacy contract and source boundaries
        run: node --test --test-concurrency=1 tests/original-agent-create-read-pure.test.mjs tests/pg-original-agent-create-fresh-source-pure.test.mjs tests/pg-original-agent-create-fixture-contract-pure.test.mjs
      - name: Build the existing main App with the original PG adapter
        run: pnpm build:pg18:original-ui
      - name: Install locked Chromium under the exact fresh-story purpose
        run: node tests/helpers/install-original-agent-create-chromium.mjs
      - name: Original agent-create current spec, real Worker receipt and ACL privacy story
        run: node node_modules/@playwright/test/cli.js test --config tests/pg-original-agent-create-fresh-genuine.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-agent-create-fresh-${{ github.run_id }}
          path: .tmp/original-agent-create-fresh-browser-results
          if-no-files-found: ignore
          retention-days: 7
