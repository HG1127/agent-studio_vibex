name: Agent Studio original agent-create fresh PG18 browser verification
on:
  workflow_call:
    inputs:
      run_original_create:
        type: boolean
        required: true
        default: false
      registered_original_page_entry:
        type: boolean
        required: true
        default: false
      registered_original_page:
        type: string
        required: true
        default: ''
  workflow_dispatch:
    inputs:
      run_original_create:
        description: Run the original agent-create page against a disposable PG service and original Worker
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: original-agent-create-fresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-agent-create-fresh-browser:
    if: inputs.run_original_create == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: agentstudio_pg18_ci
          POSTGRES_USER: agentstudio_admin
          POSTGRES_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U agentstudio_admin -d agentstudio_pg18_ci"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      AGENT_STUDIO_REGISTERED_ORIGINAL_PAGE_ENTRY: '${{ inputs.registered_original_page_entry == true }}'
      AGENT_STUDIO_REGISTERED_ORIGINAL_PAGE: '${{ inputs.registered_original_page }}'
      AGENT_STUDIO_ORIGINAL_AGENT_CREATE_CI: YES_DISPOSABLE_ORIGINAL_AGENT_CREATE_FRESH_ONLY
      AGENT_STUDIO_ORIGINAL_AGENT_CREATE_STORY: original-agent-create-fresh
      AGENT_STUDIO_ORIGINAL_AGENT_CREATE_EXPECTED_HEAD: '${{ github.sha }}'
      AGENT_STUDIO_ORIGINAL_AGENT_CREATE_SOURCES_SHA256: 'b05f7ce2d86c2e25ae0367ea06fc52d752d3bc05e3b60c77d5801f528c22e946'
      AGENT_STUDIO_PG18_CI_EPHEMERAL: 'true'
      AGENT_STUDIO_PG18_CI_WRITE_APPROVED: YES_DISPOSABLE_GITHUB_ONLY
      AGENT_STUDIO_PG18_CI_HOST: '127.0.0.1'
      AGENT_STUDIO_PG18_CI_PORT: '5432'
      AGENT_STUDIO_PG18_CI_DATABASE: agentstudio_pg18_ci
      AGENT_STUDIO_PG18_CI_ADMIN_USER: agentstudio_admin
      AGENT_STUDIO_PG18_CI_ADMIN_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate actual caller and executing job metadata before imports
        env:
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_ENABLED: '${{ github.event.inputs.run_original_pages }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_PAGE: '${{ github.event.inputs.original_page }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_LEGACY: ${{ github.event.inputs.run_original_toolhub == 'true' }}
          AGENT_STUDIO_REGISTERED_PAGE_JOB_ID: '${{ github.job }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REF: '${{ job.workflow_ref }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_SHA: '${{ job.workflow_sha }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REPOSITORY: '${{ job.workflow_repository }}'
        run: >-
          node --input-type=module -e "import('./services/pg-api/tests/helpers/original-page-ci-entry.mjs').then(m=>console.log(JSON.stringify(m.requireOriginalPageCiEntry(process.env,'create'))))"
      - name: Verify separately reviewed source binding before driver or service imports
        env:
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_ENABLED: '${{ github.event.inputs.run_original_pages }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_PAGE: '${{ github.event.inputs.original_page }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_LEGACY: ${{ github.event.inputs.run_original_toolhub == 'true' }}
          AGENT_STUDIO_REGISTERED_PAGE_JOB_ID: '${{ github.job }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REF: '${{ job.workflow_ref }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_SHA: '${{ job.workflow_sha }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REPOSITORY: '${{ job.workflow_repository }}'
        run: node --input-type=module -e "import('./tests/helpers/pg-original-agent-create-reviewed-check.mjs').then(m=>m.verifyOriginalAgentCreateSources())"
      - name: Locked root dependencies without lifecycle scripts
        env:
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_ENABLED: '${{ github.event.inputs.run_original_pages }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_PAGE: '${{ github.event.inputs.original_page }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_LEGACY: ${{ github.event.inputs.run_original_toolhub == 'true' }}
          AGENT_STUDIO_REGISTERED_PAGE_JOB_ID: '${{ github.job }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REF: '${{ job.workflow_ref }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_SHA: '${{ job.workflow_sha }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REPOSITORY: '${{ job.workflow_repository }}'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Locked API dependencies without lifecycle scripts
        env:
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_ENABLED: '${{ github.event.inputs.run_original_pages }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_PAGE: '${{ github.event.inputs.original_page }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_LEGACY: ${{ github.event.inputs.run_original_toolhub == 'true' }}
          AGENT_STUDIO_REGISTERED_PAGE_JOB_ID: '${{ github.job }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REF: '${{ job.workflow_ref }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_SHA: '${{ job.workflow_sha }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REPOSITORY: '${{ job.workflow_repository }}'
        run: pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Original page privacy contract and source boundaries
        env:
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_ENABLED: '${{ github.event.inputs.run_original_pages }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_PAGE: '${{ github.event.inputs.original_page }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_LEGACY: ${{ github.event.inputs.run_original_toolhub == 'true' }}
          AGENT_STUDIO_REGISTERED_PAGE_JOB_ID: '${{ github.job }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REF: '${{ job.workflow_ref }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_SHA: '${{ job.workflow_sha }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REPOSITORY: '${{ job.workflow_repository }}'
        run: node --test --test-concurrency=1 tests/original-agent-create-read-pure.test.mjs tests/pg-original-agent-create-fresh-source-pure.test.mjs tests/pg-original-agent-create-fixture-contract-pure.test.mjs tests/original-page-registered-entry-pure.test.mjs tests/pg-original-agent-create-owned-pg-source.test.mjs
      - name: Build the existing main App with the original PG adapter
        env:
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_ENABLED: '${{ github.event.inputs.run_original_pages }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_PAGE: '${{ github.event.inputs.original_page }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_LEGACY: ${{ github.event.inputs.run_original_toolhub == 'true' }}
          AGENT_STUDIO_REGISTERED_PAGE_JOB_ID: '${{ github.job }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REF: '${{ job.workflow_ref }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_SHA: '${{ job.workflow_sha }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REPOSITORY: '${{ job.workflow_repository }}'
        run: pnpm build:pg18:original-ui
      - name: Install locked Chromium under the exact fresh-story purpose
        env:
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_ENABLED: '${{ github.event.inputs.run_original_pages }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_PAGE: '${{ github.event.inputs.original_page }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_LEGACY: ${{ github.event.inputs.run_original_toolhub == 'true' }}
          AGENT_STUDIO_REGISTERED_PAGE_JOB_ID: '${{ github.job }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REF: '${{ job.workflow_ref }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_SHA: '${{ job.workflow_sha }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REPOSITORY: '${{ job.workflow_repository }}'
        run: node tests/helpers/install-original-agent-create-chromium.mjs
      - name: Original agent-create current spec, real Worker receipt and ACL privacy story
        env:
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_ENABLED: '${{ github.event.inputs.run_original_pages }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_PAGE: '${{ github.event.inputs.original_page }}'
          AGENT_STUDIO_REGISTERED_PAGE_EVENT_LEGACY: ${{ github.event.inputs.run_original_toolhub == 'true' }}
          AGENT_STUDIO_REGISTERED_PAGE_JOB_ID: '${{ github.job }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REF: '${{ job.workflow_ref }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_SHA: '${{ job.workflow_sha }}'
          AGENT_STUDIO_REGISTERED_PAGE_JOB_WORKFLOW_REPOSITORY: '${{ job.workflow_repository }}'
        run: node node_modules/@playwright/test/cli.js test --config tests/pg-original-agent-create-fresh-genuine.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-agent-create-fresh-${{ github.run_id }}
          path: .tmp/original-agent-create-fresh-browser-results
          if-no-files-found: ignore
          retention-days: 7
