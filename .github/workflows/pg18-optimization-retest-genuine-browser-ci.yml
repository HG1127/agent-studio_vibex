name: Agent Studio F29 Employee Optimization Retest genuine PG18 browser verification

on:
  push:
    branches:
      - 'codex/pg18-worker-heartbeat-*'
      - 'codex/pg18-optimization-retest-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg18-f29-optimization-retest-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg18-optimization-retest-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: agentstudio_pg18_ci
          POSTGRES_USER: agentstudio_admin
          POSTGRES_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U agentstudio_admin -d agentstudio_pg18_ci"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      AGENT_STUDIO_F29_RETEST_GENUINE_CI: YES_DISPOSABLE_F29_EMPLOYEE_RETEST_ONLY
      AGENT_STUDIO_F29_RETEST_GENUINE_SUITE: browser
      AGENT_STUDIO_PG18_CI_EPHEMERAL: 'true'
      AGENT_STUDIO_PG18_CI_WRITE_APPROVED: YES_DISPOSABLE_GITHUB_ONLY
      AGENT_STUDIO_PG18_CI_HOST: '127.0.0.1'
      AGENT_STUDIO_PG18_CI_PORT: '5432'
      AGENT_STUDIO_PG18_CI_DATABASE: agentstudio_pg18_ci
      AGENT_STUDIO_PG18_CI_ADMIN_USER: agentstudio_admin
      AGENT_STUDIO_PG18_CI_ADMIN_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies without lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Actual compilers and unchanged product build
        run: |
          pnpm --dir services/pg-api check
          pnpm exec tsc -p tsconfig.app.json --noEmit
          pnpm build
      - name: Pure purpose refusal and original optimization contracts
        run: node --experimental-strip-types --test services/pg-api/tests/optimization-retest-genuine-guard.test.mjs tests/agent-optimization-retest-contract.test.mjs tests/pg-native-agent-optimization-session.test.mjs
      - name: Install isolated Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Real employee acceptance and explicit new retest with original UUID recovery
        run: node node_modules/@playwright/test/cli.js test --config=tests/pg-native-optimization-retest-genuine.config.mjs
      - name: Preserve actual failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: f29-actual-employee-optimization-retest-browser
          path: .tmp/pg-migration-completion/f29-retest-browser-results
          if-no-files-found: ignore
