name: Agent Studio F27 Exact Step Approval Delegation genuine PG18 isolated verification

on:
  push:
    branches:
      - 'codex/pg18-worker-heartbeat-*'
      - 'codex/pg18-approval-delegation-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg18-approval-delegation-genuine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg18-approval-delegation-genuine:
    name: F27 / real PG18 ${{ matrix.suite }} / ${{ matrix.purpose }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: flow
            purpose: delegation
          - suite: database
            purpose: delegation
          - suite: database
            purpose: optimization_retest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: agentstudio_pg18_ci
          POSTGRES_USER: agentstudio_admin
          POSTGRES_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U agentstudio_admin -d agentstudio_pg18_ci"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      AGENT_STUDIO_F27_GENUINE_CI: YES_DISPOSABLE_F27_ONLY
      AGENT_STUDIO_F27_GENUINE_SUITE: ${{ matrix.suite }}
      AGENT_STUDIO_PG18_APPROVAL_DELEGATIONS_AVAILABLE: 'true'
      AGENT_STUDIO_PG18_APPROVAL_DELEGATIONS_WRITES_ENABLED: 'true'
      AGENT_STUDIO_PG18_APPROVAL_DELEGATIONS_APPROVED: APPROVE_DISPOSABLE_PG18_NATIVE_EXACT_STEP_APPROVAL_DELEGATIONS_ONLY
      AGENT_STUDIO_PG18_CI_EPHEMERAL: 'true'
      AGENT_STUDIO_PG18_CI_WRITE_APPROVED: YES_DISPOSABLE_GITHUB_ONLY
      AGENT_STUDIO_PG18_CI_HOST: '127.0.0.1'
      AGENT_STUDIO_PG18_CI_PORT: '5432'
      AGENT_STUDIO_PG18_CI_DATABASE: agentstudio_pg18_ci
      AGENT_STUDIO_PG18_CI_ADMIN_USER: agentstudio_admin
      AGENT_STUDIO_PG18_CI_ADMIN_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked API dependencies without lifecycle scripts
        run: pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Actual API compiler and ordinary-host refusal guards
        run: |
          pnpm --dir services/pg-api check
          node --experimental-strip-types --test --test-concurrency=1 services/pg-api/tests/approval-delegation-genuine-guard.test.mjs services/pg-api/tests/approval-delegation-pure.test.mjs services/pg-api/tests/approval-delegation-contract.test.mjs services/pg-api/tests/approval-delegation-preview.test.mjs services/pg-api/tests/approval-delegation-shared.test.mjs
      - name: Actual Native Cookie exact-step grant revoke decisions and original receipt recovery
        if: matrix.suite == 'flow'
        working-directory: services/pg-api
        run: node --experimental-strip-types --test --test-concurrency=1 tests/approval-delegation-genuine-pg18.test.mjs
      - name: Actual installed066 catalog deferred context rollback and decision concurrency
        if: matrix.suite == 'database' && matrix.purpose == 'delegation'
        working-directory: services/pg-api
        run: node --experimental-strip-types --test --test-concurrency=1 tests/approval-delegation-database-pg18.test.mjs
      - name: F29 actual accepted optimization to original owned retest and receipt recovery
        if: matrix.suite == 'database' && matrix.purpose == 'optimization_retest'
        working-directory: services/pg-api
        run: node --experimental-strip-types --test --test-concurrency=1 tests/agent-optimization-retest-pg18.test.mjs

  pg18-approval-delegation-browser:
    name: F27 / real PG18 browser Owner delegation manager decision and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_DB: agentstudio_pg18_ci
          POSTGRES_USER: agentstudio_admin
          POSTGRES_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U agentstudio_admin -d agentstudio_pg18_ci"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      AGENT_STUDIO_F27_GENUINE_CI: YES_DISPOSABLE_F27_ONLY
      AGENT_STUDIO_F27_GENUINE_SUITE: browser
      AGENT_STUDIO_PG18_APPROVAL_DELEGATIONS_AVAILABLE: 'true'
      AGENT_STUDIO_PG18_APPROVAL_DELEGATIONS_WRITES_ENABLED: 'true'
      AGENT_STUDIO_PG18_APPROVAL_DELEGATIONS_APPROVED: APPROVE_DISPOSABLE_PG18_NATIVE_EXACT_STEP_APPROVAL_DELEGATIONS_ONLY
      AGENT_STUDIO_PG18_CI_EPHEMERAL: 'true'
      AGENT_STUDIO_PG18_CI_WRITE_APPROVED: YES_DISPOSABLE_GITHUB_ONLY
      AGENT_STUDIO_PG18_CI_HOST: '127.0.0.1'
      AGENT_STUDIO_PG18_CI_PORT: '5432'
      AGENT_STUDIO_PG18_CI_DATABASE: agentstudio_pg18_ci
      AGENT_STUDIO_PG18_CI_ADMIN_USER: agentstudio_admin
      AGENT_STUDIO_PG18_CI_ADMIN_PASSWORD: 'synthetic-agentstudio-pg18-ci-${{ github.run_id }}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies without lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir services/pg-api install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Actual browser compiler configuration and ordinary-host refusal guards
        run: |
          pnpm exec tsc -p tsconfig.app.json --noEmit
          node --experimental-strip-types --test --test-concurrency=1 services/pg-api/tests/approval-delegation-genuine-guard.test.mjs services/pg-api/tests/approval-delegation-pure.test.mjs services/pg-api/tests/approval-delegation-contract.test.mjs services/pg-api/tests/approval-delegation-preview.test.mjs services/pg-api/tests/approval-delegation-shared.test.mjs
      - name: Install isolated Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Actual HTTPS employee Owner grant revoke and manager decision recovery
        run: node node_modules/@playwright/test/cli.js test --config=tests/pg-native-approval-delegation-genuine.config.mjs
      - name: Retain synthetic page images only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg18-approval-delegation-genuine-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/F27-genuine-browser-results/**/*.png
          if-no-files-found: ignore
