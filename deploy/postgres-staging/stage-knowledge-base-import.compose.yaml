# EXTRA opt-in, one-shot import of EMPTY KB metadata only. Never on BaoTa.
# Legacy document, vector, embedding and sharing data prevents this import.
services:
  stage_knowledge_base_import:
    profiles: ["stage-kb-import"]
    build:
      context: ../../services/pg-api
      dockerfile: Dockerfile
    command: ["node", "--experimental-strip-types", "src/stage-knowledge-base-import-cli.ts", "--execute", "--snapshot", "/run/input/snapshot.sqlite", "--manifest", "/run/input/manifest.json", "--mapping", "/run/input/approved-map.json"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENT_STUDIO_PG_STAGE_KB_IMPORT_ENABLED: "true"
      AGENT_STUDIO_PG_HOST: postgres
      AGENT_STUDIO_PG_DATABASE: agentstudio_stage
      AGENT_STUDIO_PG_IMPORT_USER: agentstudio_admin
      AGENT_STUDIO_PG_IMPORT_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - type: bind
        source: ${AGENT_STUDIO_STAGE_KB_SNAPSHOT_FILE:?Approved offline consistent snapshot required}
        target: /run/input/snapshot.sqlite
        read_only: true
      - type: bind
        source: ${AGENT_STUDIO_STAGE_KB_MANIFEST_FILE:?Verified SHA256 manifest required}
        target: /run/input/manifest.json
        read_only: true
      - type: bind
        source: ${AGENT_STUDIO_STAGE_KB_MAPPING_FILE:?Approved owner UUID mapping required}
        target: /run/input/approved-map.json
        read_only: true
    networks:
      - private_db
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 700m
    cpus: 0.7
    pids_limit: 80
    stop_grace_period: 25s
