# W16 — explicit, one-shot embedding settings/queue HISTORY ONLY.
# Source is an approved frozen SQLite snapshot mounted read-only.
# Does not start a model, embedding worker, job queue, or live ACL.
services:
  stage_embedding_archive:
    profiles: ["stage-embedding-archive"]
    build:
      context: ../../services/pg-api
      dockerfile: Dockerfile
    command: ["node", "--experimental-strip-types", "src/stage-kb-embedding-import-cli.ts", "--execute", "--confirm-stage", "agentstudio_stage", "--snapshot", "/run/input/snapshot.sqlite", "--manifest", "/run/input/manifest.json", "--mapping", "/run/input/reviewed-map.json"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENT_STUDIO_PG_STAGE_EMBEDDING_ARCHIVE_ENABLED: "true"
      AGENT_STUDIO_PG_HOST: postgres
      AGENT_STUDIO_PG_DATABASE: agentstudio_stage
      AGENT_STUDIO_PG_IMPORT_USER: agentstudio_admin
      AGENT_STUDIO_PG_IMPORT_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - type: bind
        source: ${AGENT_STUDIO_STAGE_EMBEDDING_SNAPSHOT_FILE:?Frozen approved SQLite snapshot outside repository required}
        target: /run/input/snapshot.sqlite
        read_only: true
      - type: bind
        source: ${AGENT_STUDIO_STAGE_EMBEDDING_MANIFEST_FILE:?Complete SHA256 manifest required}
        target: /run/input/manifest.json
        read_only: true
      - type: bind
        source: ${AGENT_STUDIO_STAGE_EMBEDDING_MAPPING_FILE:?Approved old-to-UUID identity map required}
        target: /run/input/reviewed-map.json
        read_only: true
    networks:
      - private_db
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 700m
    cpus: 0.75
    pids_limit: 80
    stop_grace_period: 30s
