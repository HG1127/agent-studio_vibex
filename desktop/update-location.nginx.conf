# Review and insert INSIDE the existing HTTPS server block. This is a source
# example, not permission to change/reload the production server.
# Publish directory contains only signed public update artifacts, never keys.
location ^~ /desktop-updates/ {
    alias /www/agent-studio-desktop-updates/;
    autoindex off;
    default_type application/octet-stream;
    types { application/json json; application/octet-stream exe; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}
